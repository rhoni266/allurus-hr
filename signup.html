<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Start your free trial | Allurus</title>
<meta name="description" content="Sign up your company for Allurus and try it free for 30 days. No card needed.">
<link rel="icon" type="image/svg+xml" href="/assets/logo-mark.svg">
<link rel="stylesheet" href="/css/styles.css?v=3.15">
<style>
  .su-card { max-width: 560px; }
  .su-card .form-grid { grid-template-columns: 1fr 1fr; }
  @media (max-width: 560px) { .su-card .form-grid { grid-template-columns: 1fr; } }
  .ac-rules { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; text-align: left; font-size: 13px; color: var(--fg-2); }
  .ac-rules li::before { content: "○"; display: inline-block; width: 18px; color: var(--fg-3); }
  .ac-rules li.ok { color: var(--ok); } .ac-rules li.ok::before { content: "✓"; color: var(--ok); }
  .ac-ok { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--ok-soft); color: var(--ok); font-size: 13.5px; font-weight: 500; text-align: left; }
  .su-inds { display: flex; flex-wrap: wrap; gap: 6px 14px; text-align: left; }
  .su-inds label, .su-terms label { display: inline-flex; gap: 6px; align-items: flex-start; font-size: 13.5px; cursor: pointer; text-align: left; }
  .su-terms { display: grid; gap: 8px; }
  .hp { position: absolute; left: -9999px; }
</style>
</head>
<body>
<main class="login" id="su"><div class="login-inner"><p class="sub">Loading…</p></div></main>
<script src="/js/firebase-config.js?v=3.15"></script>
<script src="/js/billing-rules.js?v=3.15"></script>
<script src="/js/password-rules.js?v=3.15"></script>
<script src="/js/places-rules.js?v=3.16"></script>
<script src="/js/places-field.js?v=3.16"></script>
<script type="module" src="/js/signup.js?v=3.15"></script>
</body>
</html>
