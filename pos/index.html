<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Cafe POS</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <header class="top no-print">
    <strong id="biz">Cafe POS</strong>
    <nav>
      <button data-view="till" class="tab on">Till</button>
      <button data-view="summary" class="tab">Today</button>
      <button data-view="products" class="tab">Products</button>
    </nav>
  </header>

  <main id="view-till" class="view till no-print">
    <section class="menu">
      <input id="search" type="search" placeholder="Search menu" autocomplete="off">
      <div id="chips" class="chips"></div>
      <div id="grid" class="grid"><p class="muted">Loading menu…</p></div>
    </section>
    <section class="cart" id="cart">
      <div class="seg" role="group" aria-label="Order type">
        <button data-type="takeaway" class="on">Takeaway</button>
        <button data-type="dine_in">Dine-in</button>
      </div>
      <label class="row">Table no. <input id="table" inputmode="numeric" maxlength="10" placeholder="optional"></label>
      <ul id="lines" class="lines"></ul>
      <div class="row">
        <span>Discount</span>
        <input id="disc" inputmode="decimal" placeholder="0">
        <select id="discType"><option value="rm">RM</option><option value="pct">%</option></select>
      </div>
      <dl id="totals" class="totals"></dl>
      <div class="actions">
        <button id="clear" class="ghost">Clear</button>
        <button id="ticket" class="ghost">Bar ticket</button>
        <button id="pay" class="primary">Pay</button>
      </div>
    </section>
  </main>

  <main id="view-summary" class="view no-print" hidden>
    <div class="row wrap">
      <input id="day" type="date">
      <button id="refreshSum" class="ghost">Refresh</button>
      <button id="csv" class="ghost">Download CSV</button>
    </div>
    <div id="summary"><p class="muted">Loading…</p></div>
  </main>

  <main id="view-products" class="view no-print" hidden>
    <div class="row wrap"><button id="addProduct" class="primary">Add product</button></div>
    <div id="plist"><p class="muted">Loading…</p></div>
  </main>

  <div id="modal" class="modal no-print" hidden><div class="sheet" id="sheet"></div></div>
  <div id="toast" class="toast no-print" role="status" aria-live="polite"></div>
  <div id="print" class="print-only"></div>

  <script src="config.js"></script>
  <script src="api.js?v=1"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
