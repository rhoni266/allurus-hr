<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pendaftaran Staf | Staff Onboarding | Allurus</title>
<meta name="description" content="Pendaftaran pantas staf Allurus HR. Zero-friction staff onboarding for Allurus HR.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg">
<link rel="stylesheet" href="css/styles.css?v=3.13">
<style>
  .wizard-pill { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 5px 14px; border-radius: 999px; background: var(--bg-soft, #f1f5f9); color: var(--fg-2, #64748b); font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 12px; }
  .company-badge { display: inline-flex; align-items: center; gap: 8px; padding: 7px 16px; border-radius: 12px; background: var(--surface-2, #f8fafc); border: 1px solid var(--border, #e2e8f0); font-size: 14.5px; font-weight: 600; color: var(--fg, #0f172a); margin-bottom: 12px; max-width: 100%; word-break: break-word; }
  .input-lg { height: 56px !important; font-size: 22px !important; text-align: center; font-weight: 600; letter-spacing: 0.08em; border-radius: 14px !important; border: 2px solid var(--border, #cbd5e1); transition: border-color 0.2s, box-shadow 0.2s; width: 100%; box-sizing: border-box; }
  .input-lg:focus { border-color: var(--brand, #0f766e) !important; box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.15); outline: none; }
  .input-pin { font-size: 32px !important; letter-spacing: 0.35em !important; text-align: center; }
  .btn-lg { height: 52px !important; font-size: 16px !important; font-weight: 600; border-radius: 14px !important; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
  .welcome-box { padding: 16px; border-radius: 16px; background: #ecfdf5; border: 1.5px solid #10b981; color: #065f46; text-align: center; margin-bottom: 14px; animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
  .welcome-badge { display: inline-block; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: #047857; margin-bottom: 4px; }
  .ic-clean-preview { font-size: 13.5px; font-weight: 600; color: var(--fg-2, #64748b); text-align: center; min-height: 20px; margin-top: 6px; letter-spacing: 0.04em; }
  .login-card { border-radius: 24px; padding: 26px; }
  .ac-ok { margin: 0; padding: 12px 14px; border-radius: 12px; background: #ecfdf5; color: #065f46; font-size: 14px; font-weight: 500; text-align: center; }
  .ac-rules { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; text-align: left; font-size: 13px; color: var(--fg-2); }
  .ac-rules li::before { content: "○"; display: inline-block; width: 18px; color: var(--fg-3); }
  .ac-rules li.ok { color: var(--ok); } .ac-rules li.ok::before { content: "✓"; color: var(--ok); }
  @keyframes popIn { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>
<main class="login" id="ac"><div class="login-inner"><p class="sub">Memuatkan / Loading…</p></div></main>
<script src="js/firebase-config.js?v=3.13"></script>
<script src="js/invite-rules.js?v=3.32"></script>
<script src="js/cloud-map.js?v=3.32"></script>
<script src="js/password-rules.js?v=3.32"></script>
<script type="module" src="js/join.js?v=3.32"></script>
</body>
</html>
