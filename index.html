<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Allurus HR</title>
<meta name="description" content="Allurus — people operations for growing companies.">
<link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg">
<link rel="stylesheet" href="css/styles.css?v=1.8">
</head>
<body>
<!--app:start-->
<div id="login" class="login" hidden></div>

<div class="app" hidden>
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="brand">
      <span id="brand-mark"></span>
      <div><div class="brand-word">ALLURUS</div><div class="brand-sub" id="company-name"></div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <a class="btn btn-ghost btn-sm" href="brand.html" style="justify-content:flex-start;gap:10px;color:var(--fg-2)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 1.8-.8 1.8-1.7 0-1.1-.9-1.5-.9-2.6 0-1 .8-1.7 1.8-1.7H17a4 4 0 0 0 4-4C21 6.5 17 3 12 3z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="11" cy="7.5" r="1.2"/><circle cx="15.5" cy="8.5" r="1.2"/></svg>Brand kit</a>
      <div class="me" id="me-card"></div>
    </div>
  </aside>

  <div class="main-wrap">
    <header class="topbar">
      <button class="btn btn-icon btn-ghost menu-btn" data-act="menu" aria-label="Open menu"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="search">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="global-search" type="search" placeholder="Search people  ⌘K" autocomplete="off" aria-label="Search people">
        <div class="search-results" id="search-results" hidden></div>
      </div>
      <div class="top-spacer"></div>
      <span class="today" id="today"></span>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>

<div id="overlay-root"></div>
<div class="toast-root" id="toast-root" aria-live="polite"></div>

<script src="js/vendor/jsvectormap.min.js?v=1.8"></script>
<script src="js/vendor/world.js?v=1.8"></script>
<script src="js/utils.js?v=1.8"></script>
<script src="js/seed.js?v=1.8"></script>
<script src="js/finance.js?v=1.8"></script>
<script src="js/tax.js?v=1.8"></script>
<script src="js/face.js?v=1.8"></script>
<script src="js/receipt.js?v=1.8"></script>
<script src="js/app.js?v=1.8"></script>
<!--app:end-->
</body>
</html>
