<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Allurus apps</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#16181D;-webkit-font-smoothing:antialiased}
a{color:#0F766E}a:hover{color:#0B5F59}
button{font-family:inherit}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; padding: 40px 24px 28px; background: #1B2A2A; display: flex; flex-direction: column; align-items: center; gap: 28px">
<label style="display: flex; align-items: center; gap: 8px; width: 100%; max-width: 280px; height: 34px; padding: 0 12px; border-radius: 9px; background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.16); color: rgba(255,255,255,0.8); font-size: 13px; box-sizing: border-box">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-5-5"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search apps</span>
<input type="search" placeholder="Search" value="{{q}}" onInput="{{onSearch}}" style="border: 0; background: transparent; outline: none; font: inherit; color: #fff; width: 100%">
</label>

<div style="width: 100%; max-width: 1040px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 34px 20px">
<sc-for list="{{apps}}" as="app" hint-placeholder-count="18">
<a href="{{app.href}}" style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-decoration: none; color: #fff">
<span style="{{app.icon}}"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{app.d}}"></path></svg>
<sc-if value="{{app.badge}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; top: -6px; right: -6px; min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 11px; background: #B3261E; color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; border: 2px solid #1B2A2A">{{app.badge}}</span></sc-if>
</span>
<span style="font-size: 13px; font-weight: 500; text-align: center; text-shadow: 0 1px 2px rgba(0,0,0,0.35)">{{app.label}}</span>
</a>
</sc-for>
</div>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}"><p style="color: rgba(255,255,255,0.8); font-size: 14px">No app called “{{q}}”.</p></sc-if>

<div style="display: flex; gap: 8px; margin-top: auto" aria-hidden="true">
<span style="width: 7px; height: 7px; border-radius: 50%; background: #fff"></span><span style="width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.35)"></span>
</div>

<nav aria-label="Favourites" style="display: flex; gap: 10px; padding: 8px 12px; border-radius: 22px; background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.18); backdrop-filter: blur(24px)">
<sc-for list="{{dock}}" as="d" hint-placeholder-count="6">
<a href="{{d.href}}" aria-label="{{d.label}}" title="{{d.label}}" style="{{d.icon}}"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{d.d}}"></path></svg></a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { q: '' }; }
  renderVals() {
    const I = {
      users: 'M16 19v-1a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v1M9 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM22 19v-1a4 4 0 0 0-3-3.9M16 4.1a3 3 0 0 1 0 5.8',
      clock: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2',
      cal: 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',
      wallet: 'M3 7h18v12H3zM3 7l2-3h14l2 3M16 13h2',
      receipt: 'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6',
      brief: 'M3 8h18v11H3zM8 8V5h8v3M3 13h18',
      star: 'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z',
      book: 'M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 19V5',
      shield: 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z',
      chart: 'M4 20V10M10 20V4M16 20v-7M22 20H2',
      doc: 'M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h6',
      box: 'M3 7l9-4 9 4-9 4zM3 7v10l9 4 9-4V7M12 11v10',
      cart: 'M3 4h2l2.4 11h10.6l2-8H6.2M9 20h.01M17 20h.01',
      store: 'M4 9l1.5-5h13L20 9M4 9h16v11H4zM9 20v-6h6v6',
      report: 'M5 3h14v18H5zM9 8h6M9 12h6M9 16h3',
      mega: 'M3 10v4h4l6 4V6L7 10zM17 9a4 4 0 0 1 0 6',
      laptop: 'M4 5h16v10H4zM2 19h20',
      gear: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1'
    };
    // Brand tiles only: teal, deep teal, champagne (dark glyph), obsidian, slate.
    const T = { teal: ['#0F766E', '#fff'], deep: ['#0B5F59', '#fff'], gold: ['#D9B66F', '#16181D'], ink: ['#16181D', '#fff'], slate: ['#5F636B', '#fff'], mist: ['#F5F5F7', '#0F766E'] };
    const tile = (k, size) => 'position:relative;width:' + size + 'px;height:' + size + 'px;border-radius:' + Math.round(size * 0.225) + 'px;background:' + T[k][0] + ';color:' + T[k][1] + ';display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.22)';
    const all = [
      ['Employees', 'users', 'teal', ''], ['Attendance', 'clock', 'teal', ''], ['Leave', 'cal', 'deep', '2'], ['Payroll', 'wallet', 'gold', ''], ['Claims', 'receipt', 'gold', '3'], ['Hiring', 'brief', 'deep', ''],
      ['Appraisal', 'star', 'deep', ''], ['Training', 'book', 'teal', ''], ['Grievance', 'shield', 'slate', ''], ['Finance', 'chart', 'ink', ''], ['Invoices', 'doc', 'ink', ''], ['Stock', 'box', 'slate', ''],
      ['Purchasing', 'cart', 'slate', ''], ['Point of sale', 'store', 'gold', ''], ['Reports', 'report', 'ink', ''], ['Announcements', 'mega', 'teal', ''], ['Assets', 'laptop', 'slate', ''], ['Settings', 'gear', 'mist', '']
    ];
    const q = this.state.q.trim().toLowerCase();
    const apps = all.filter(([l]) => !q || l.toLowerCase().includes(q)).map(([label, i, k, badge]) => ({ label, d: I[i], badge, href: '#', icon: tile(k, 84) }));
    const dock = [['Home', 'chart', 'ink'], ['Employees', 'users', 'teal'], ['Leave', 'cal', 'deep'], ['Payroll', 'wallet', 'gold'], ['Point of sale', 'store', 'gold'], ['Settings', 'gear', 'mist']]
      .map(([label, i, k]) => ({ label, d: I[i], href: '#', icon: tile(k, 52) }));
    return { q: this.state.q, apps, dock, empty: apps.length === 0, onSearch: (e) => this.setState({ q: e.target.value }) };
  }
}
</script>
</body>
</html>
