<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Allurus employees</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#16181D;-webkit-font-smoothing:antialiased}
a{color:#0F766E}a:hover{color:#0B5F59}
button{font-family:inherit}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; padding: 28px; background: #DCE3E2; display: flex; justify-content: center; align-items: flex-start">
<div style="width: 100%; max-width: 1384px; border-radius: 14px; background: rgba(255,255,255,0.8); backdrop-filter: blur(30px); border: 1px solid rgba(22,24,29,0.10); box-shadow: 0 24px 60px rgba(22,24,29,0.18), 0 2px 6px rgba(22,24,29,0.08); overflow: hidden; display: flex; flex-direction: column">

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid rgba(22,24,29,0.08); background: rgba(243,244,246,0.85)">
<div style="display: flex; gap: 8px; padding-right: 8px" aria-hidden="true">
<span style="width: 12px; height: 12px; border-radius: 50%; background: #FF5F57; border: 0.5px solid rgba(0,0,0,0.12)"></span>
<span style="width: 12px; height: 12px; border-radius: 50%; background: #FEBC2E; border: 0.5px solid rgba(0,0,0,0.12)"></span>
<span style="width: 12px; height: 12px; border-radius: 50%; background: #28C840; border: 0.5px solid rgba(0,0,0,0.12)"></span>
</div>
<button type="button" aria-label="Back" style="width: 30px; height: 28px; border: 0; border-radius: 7px; background: transparent; color: #5F636B; cursor: pointer; display: grid; place-items: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
<h1 style="margin: 0 auto 0 0; font-size: 15px; font-weight: 700">Employees <span style="font-weight: 500; color: #5F636B">· {{count}}</span></h1>
<div role="group" aria-label="Filter" style="display: flex; padding: 2px; border-radius: 8px; background: rgba(22,24,29,0.06)">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="4"><button type="button" onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="{{f.style}}">{{f.label}}</button></sc-for>
</div>
<label style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 8px; background: rgba(22,24,29,0.06); color: #5F636B; font-size: 13px; min-width: 180px">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-5-5"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search employees</span>
<input type="search" placeholder="Search" style="border: 0; background: transparent; outline: none; font: inherit; color: #16181D; width: 100%">
</label>
<button type="button" style="height: 30px; padding: 0 12px; border-radius: 8px; border: 0; background: #0F766E; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add</button>
</div>

<div style="display: flex; flex-wrap: wrap; min-height: 760px">
<div style="flex: 999 1 560px; min-width: 0; overflow-x: auto">
<table style="width: 100%; border-collapse: collapse; font-size: 13px; min-width: 620px">
<thead><tr style="text-align: left; color: #5F636B; font-size: 12px">
<th scope="col" style="padding: 10px 16px; font-weight: 600; border-bottom: 1px solid rgba(22,24,29,0.08)">Name</th>
<th scope="col" style="padding: 10px 8px; font-weight: 600; border-bottom: 1px solid rgba(22,24,29,0.08)">Department</th>
<th scope="col" style="padding: 10px 8px; font-weight: 600; border-bottom: 1px solid rgba(22,24,29,0.08)">Sign-in</th>
<th scope="col" style="padding: 10px 8px; font-weight: 600; border-bottom: 1px solid rgba(22,24,29,0.08)">Status</th>
<th scope="col" style="padding: 10px 16px; font-weight: 600; border-bottom: 1px solid rgba(22,24,29,0.08)">Started</th>
</tr></thead>
<tbody>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
<tr onClick="{{r.pick}}" style="{{r.rowStyle}}">
<td style="padding: 8px 16px"><button type="button" onClick="{{r.pick}}" style="{{r.nameStyle}}"><span style="{{r.avatar}}">{{r.initials}}</span><span style="display: flex; flex-direction: column; line-height: 1.25; text-align: left"><b style="font-weight: 600">{{r.name}}</b><span style="{{r.subStyle}}">{{r.role}}</span></span></button></td>
<td style="padding: 8px">{{r.dept}}</td>
<td style="padding: 8px">{{r.signin}}</td>
<td style="padding: 8px"><span style="{{r.chip}}">{{r.status}}</span></td>
<td style="padding: 8px 16px; font-variant-numeric: tabular-nums">{{r.start}}</td>
</tr>
</sc-for>
</tbody>
</table>
</div>

<aside aria-label="Details" style="flex: 1 1 300px; max-width: 360px; box-sizing: border-box; padding: 20px; border-left: 1px solid rgba(22,24,29,0.08); background: rgba(246,247,248,0.85); display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 0 4px">
<span style="width: 72px; height: 72px; border-radius: 50%; background: rgba(15,118,110,0.14); color: #0F766E; font-size: 26px; font-weight: 700; display: grid; place-items: center">{{sel.initials}}</span>
<b style="font-size: 17px">{{sel.name}}</b>
<span style="font-size: 13px; color: #5F636B">{{sel.role}} · {{sel.dept}}</span>
<span style="{{sel.chip}}">{{sel.status}}</span>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<button type="button" style="height: 56px; border: 1px solid rgba(22,24,29,0.08); border-radius: 10px; background: #fff; font-size: 12px; font-weight: 500; color: #16181D; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0F766E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4zM4 9h16"></path></svg>Profile</button>
<button type="button" style="height: 56px; border: 1px solid rgba(22,24,29,0.08); border-radius: 10px; background: #fff; font-size: 12px; font-weight: 500; color: #16181D; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0F766E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18v12H3zM3 7l2-3h14l2 3M16 13h2"></path></svg>Payslips</button>
<button type="button" style="height: 56px; border: 1px solid rgba(22,24,29,0.08); border-radius: 10px; background: #fff; font-size: 12px; font-weight: 500; color: #16181D; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0F766E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"></path></svg>Access</button>
</div>
<div style="background: #fff; border: 1px solid rgba(22,24,29,0.07); border-radius: 12px; overflow: hidden">
<sc-for list="{{sel.facts}}" as="f" hint-placeholder-count="6">
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 10px 14px; border-bottom: 1px solid rgba(22,24,29,0.06); font-size: 13px"><span style="color: #5F636B">{{f.k}}</span><span style="font-weight: 500; text-align: right">{{f.v}}</span></div>
</sc-for>
</div>
<div style="background: #fff; border: 1px solid rgba(22,24,29,0.07); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; font-weight: 600; color: #5F636B">Leave balance</span>
<div style="display: flex; justify-content: space-between; font-size: 13px"><span>Annual</span><b style="font-variant-numeric: tabular-nums">{{sel.annual}} days</b></div>
<div style="height: 6px; border-radius: 3px; background: #EEF0F2"><div style="{{sel.bar}}"></div></div>
<div style="display: flex; justify-content: space-between; font-size: 13px"><span>Medical</span><b style="font-variant-numeric: tabular-nums">{{sel.medical}} days</b></div>
</div>
</aside>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sel: 'e1', filter: 'All' }; }
  renderVals() {
    const people = [
      { id: 'e1', name: 'Hafidz Rosali', role: 'Managing director', dept: 'Management', signin: 'Email', status: 'Owner', start: '2019-03-01', annual: 18, used: 4, medical: 14, phone: '012-xxx 4410', ic: '•••• •••• 4521', bank: 'Maybank ••• 2210' },
      { id: 'e2', name: 'Siti Nurhaliza', role: 'HR executive', dept: 'Human resources', signin: 'Email', status: 'HR admin', start: '2021-07-15', annual: 14, used: 6, medical: 14, phone: '013-xxx 8832', ic: '•••• •••• 7712', bank: 'CIMB ••• 9081' },
      { id: 'e3', name: 'Nur Aisyah', role: 'Line leader', dept: 'Production', signin: 'IC', status: 'On leave', start: '2022-01-10', annual: 12, used: 9, medical: 14, phone: '017-xxx 1209', ic: '•••• •••• 3304', bank: 'Bank Islam ••• 4410' },
      { id: 'e4', name: 'Ravi Kumar', role: 'Driver', dept: 'Logistics', signin: 'IC', status: 'Registered', start: '2023-05-02', annual: 12, used: 2, medical: 14, phone: '016-xxx 5521', ic: '•••• •••• 9110', bank: 'Maybank ••• 7716' },
      { id: 'e5', name: 'Lim Mei Ling', role: 'Accounts clerk', dept: 'Finance', signin: 'Email', status: 'Finance', start: '2020-11-23', annual: 16, used: 5, medical: 14, phone: '012-xxx 9934', ic: '•••• •••• 1188', bank: 'Public Bank ••• 3392' },
      { id: 'e6', name: 'Azman Zain', role: 'Machine operator', dept: 'Production', signin: 'IC', status: 'Link sent', start: '2026-10-05', annual: 8, used: 0, medical: 14, phone: '019-xxx 2276', ic: '•••• •••• 6620', bank: '—' },
      { id: 'e7', name: 'Dewi Lestari', role: 'Packer', dept: 'Production', signin: 'IC', status: 'Not invited', start: '2026-11-02', annual: 8, used: 0, medical: 14, phone: '—', ic: '•••• •••• 0457', bank: '—' },
      { id: 'e8', name: 'Tan Wei Jie', role: 'Storekeeper', dept: 'Stores', signin: 'IC', status: 'Registered', start: '2024-02-19', annual: 12, used: 3, medical: 14, phone: '011-xxx 6048', ic: '•••• •••• 2291', bank: 'RHB ••• 1104' }
    ];
    const chipOf = (s) => {
      const c = { 'Owner': ['rgba(15,118,110,.14)', '#0B5F59'], 'HR admin': ['rgba(15,118,110,.14)', '#0B5F59'], 'Finance': ['rgba(15,118,110,.14)', '#0B5F59'], 'Registered': ['rgba(23,128,74,.12)', '#17804A'],
        'On leave': ['rgba(217,182,111,.28)', '#6E5420'], 'Link sent': ['rgba(47,106,208,.12)', '#2F6AD0'], 'Not invited': ['rgba(22,24,29,.07)', '#5F636B'] }[s] || ['rgba(22,24,29,.07)', '#5F636B'];
      return 'display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:' + c[0] + ';color:' + c[1];
    };
    const initials = (n) => n.split(' ').map((w) => w[0]).slice(0, 2).join('');
    const f = this.state.filter;
    const keep = (p) => f === 'All' || (f === 'Registered' && ['Owner', 'HR admin', 'Finance', 'Registered', 'On leave'].includes(p.status)) || (f === 'Not joined' && ['Link sent', 'Not invited'].includes(p.status)) || (f === 'IC staff' && p.signin === 'IC');
    const list = people.filter(keep);
    const rows = list.map((p) => {
      const on = p.id === this.state.sel;
      return { ...p, initials: initials(p.name), chip: chipOf(p.status), pick: () => this.setState({ sel: p.id }),
        rowStyle: 'cursor:pointer;' + (on ? 'background:#0F766E;color:#fff' : 'background:transparent'),
        nameStyle: 'display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:0;font:inherit;cursor:pointer;color:inherit',
        subStyle: 'font-size:12px;' + (on ? 'color:rgba(255,255,255,.85)' : 'color:#5F636B'),
        avatar: 'width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;' + (on ? 'background:rgba(255,255,255,.22);color:#fff' : 'background:rgba(15,118,110,.12);color:#0F766E') };
    });
    const s = people.find((p) => p.id === this.state.sel) || people[0];
    const sel = { ...s, initials: initials(s.name), chip: chipOf(s.status), annual: String(s.annual - s.used),
      bar: 'height:6px;border-radius:3px;background:#0F766E;width:' + Math.round(100 * (s.annual - s.used) / s.annual) + '%',
      facts: [{ k: 'Sign-in', v: s.signin === 'IC' ? 'Company code + IC' : 'Email' }, { k: 'Phone', v: s.phone }, { k: 'IC', v: s.ic }, { k: 'Bank', v: s.bank }, { k: 'Started', v: s.start }, { k: 'Department', v: s.dept }] };
    const filters = ['All', 'Registered', 'Not joined', 'IC staff'].map((label) => {
      const on = label === f;
      return { label, on: on ? 'true' : 'false', pick: () => this.setState({ filter: label }),
        style: 'height:26px;padding:0 12px;border:0;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;' + (on ? 'background:#fff;color:#16181D;box-shadow:0 1px 2px rgba(22,24,29,.15)' : 'background:transparent;color:#5F636B') };
    });
    return { rows, sel, filters, count: String(list.length) };
  }
}
</script>
</body>
</html>
